<title>ふたりのキャッシュフロー表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="大阪の相場つき。ふたりの収入・住まい・結婚式・子育て・旅行から、人生のお金の流れを計算するツール">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: アプリ型。上に固定ヘッダー、中央に1カラム（iPadでは2カラム）、下に5つのタブ。数字はグラフと年表で読む */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --surface-2:#E5ECEE; --ink:#11232A; --muted:#55686F; --line:#D2DDE1;
  --accent:#0A7480; --accent-strong:#065A63; --accent-soft:#D3EBEE; --on-accent:#FFFFFF;
  --gold:#A8670F; --gold-soft:#F7E9D2;
  --plus:#1F7F55; --plus-soft:#DAF0E4; --minus:#BE3149; --minus-soft:#F8DFE4; --invest:#93C7CD;
  --knob:#FFFFFF; --scrim:rgba(8,20,24,.42); --shadow:0 1px 2px rgba(17,35,42,.07),0 6px 18px rgba(17,35,42,.07);
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --r:16px; --tabh:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1518; --surface:#152126; --surface-2:#1D2C31; --ink:#E3ECEE; --muted:#93A6AC; --line:#293B41;
    --accent:#3FB3BE; --accent-strong:#73CCD4; --accent-soft:#143A40; --on-accent:#05262A;
    --gold:#E2A64C; --gold-soft:#372A16;
    --plus:#5CC490; --plus-soft:#153226; --minus:#F07B8D; --minus-soft:#3C1C24; --invest:#2C6A71;
    --knob:#EEF4F5; --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1518; --surface:#152126; --surface-2:#1D2C31; --ink:#E3ECEE; --muted:#93A6AC; --line:#293B41;
  --accent:#3FB3BE; --accent-strong:#73CCD4; --accent-soft:#143A40; --on-accent:#05262A;
  --gold:#E2A64C; --gold-soft:#372A16;
  --plus:#5CC490; --plus-soft:#153226; --minus:#F07B8D; --minus-soft:#3C1C24; --invest:#2C6A71;
  --knob:#EEF4F5; --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.35}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
.num,.kpi .v,.amt,table{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand .t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.hpill{margin-left:auto;flex:none;border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;line-height:1.3;text-align:right}
.hpill small{display:block;font-weight:400;font-size:10.5px;opacity:.85;white-space:nowrap}
@media (max-width:430px){.hpill .yr{display:none}.brand b{font-size:15px}.top-in{gap:8px}}
.good{background:var(--plus-soft);color:var(--plus)}
.warn{background:var(--gold-soft);color:var(--gold)}
.bad{background:var(--minus-soft);color:var(--minus)}

main.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(var(--tabh) + 32px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:16px}
.lead{color:var(--muted);font-size:14px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--tabh)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);padding:0}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent);line-height:1.3;text-align:center}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--accent)}
.btn.danger{background:var(--minus-soft);color:var(--minus)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:700;font-size:13.5px}

/* sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .ic{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.sec>summary .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sec>summary .tx{min-width:0;flex:1}
.sec>summary .ttl{display:block;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.3}
.sec>summary .sub{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;transition:transform .2s}
.sec[open]>summary .chev{transform:rotate(180deg)}
.sec-body{padding:0 12px 14px;display:grid;gap:14px;min-width:0}
.inputs{display:grid;gap:12px;align-items:start}
@media (min-width:900px){.inputs{grid-template-columns:repeat(2,minmax(0,1fr))}}

.group{border:1px solid var(--line);border-radius:14px;padding:2px 12px;background:var(--surface)}
.group>.gh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 4px}
.group>.gh b{font-size:15px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child,.gh+.row{border-top:0}
.row>label:not(.sw),.row>.lbl{flex:1 1 7.5em;min-width:0;font-size:14.5px;line-height:1.5}
.row .hint,.row>.chips,.row>.seg,.row>.full{flex-basis:100%}
.hint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.hint b{color:var(--ink)}

function merge(def, o){

    if(o && typeof o === 'object') for(const k in o) r[k] = (k in def) ? merge(def[k], o[k]) : o[k];
    return r;
  }
  return (o === undefined || o === null) ? def : o;
}

/* ===== 税・社会保険（概算） ===== */
function incomeTax(x){
  const B = [[1950000,.05,0],[3300000,.10,97500],[6950000,.20,427500],[9000000,.23,636000],[18000000,.33,1536000],[40000000,.40,2796000],[Infinity,.45,4796000]];
  for(const [lim,r,d] of B) if(x <= lim) return Math.max(0, x*r - d);
  return 0;
}
// 額面（万円）→ 手取りなど（万円）。健康保険・厚生年金・雇用保険・介護保険（40〜64歳）・子ども子育て支援金を概算
function taxes(gross, age){
  const y = gross*1e4;
  if(!(y > 0)) return {si:0, it:0, rt:0, net:0};
  const si = y*(0.0512+0.0055+0.0012) + Math.min(y, 7800000)*0.0915 + ((age>=40 && age<65) ? y*0.008 : 0);
  let ded;
  if(y <= 1900000) ded = Math.min(y, 650000);
  else if(y <= 3600000) ded = y*0.3 + 80000;
  else if(y <= 6600000) ded = y*0.2 + 440000;
  else if(y <= 8500000) ded = y*0.1 + 1100000;
  else ded = 1950000;
  const inc = Math.max(0, y - ded);
  const it = incomeTax(Math.max(0, inc - si - 580000))*1.021;
  const tr = Math.max(0, inc - si - 430000);
  const rt = tr > 0 ? tr*0.10 + 5000 : 0;
  return {si:si/1e4, it:it/1e4, rt:rt/1e4, net:(y - si - it - rt)/1e4};
}
function growthOf(p, age){
  if(age < 40) return +p.young||0;
  if(age < 55) return +p.mid||0;
  return +p.senior||0;
}
function projectGross(p, toAge){
  let g = +p.income||0;
  for(let a = p.age; a < toAge; a++) g *= 1 + growthOf(p, a)/100;
  return g;
}
function netNow(p){
  return p.inputType === 'net' ? (+p.income||0) : taxes(+p.income||0, p.age).net;
}
// 年金の目安（今の価値・手取り・年額・万円）：基礎年金 約83万円＋厚生年金（平均年収×0.5481%×加入年数）
function estimatePension(p){
  const toGross = v => p.inputType === 'net' ? v/0.78 : v;
  const g0 = toGross(+p.income||0);
  if(g0 <= 0) return Math.round(83*0.9);
  let g = g0, sum = 0, n = 0;
  for(let a = p.age; a < p.retireAge; a++){ sum += g; n++; g *= 1 + growthOf(p, a)/100; }
  const past = Math.max(0, p.age - 22);
  const avgFuture = n ? sum/n : g0;
  const years = past + n;
  const avg = years ? (g0*0.8*past + avgFuture*n)/years : g0;
  const reYears = Math.max(0, Math.min(p.reemployUntil, 70) - p.retireAge);
  const kousei = Math.min(avg, 1000)*0.005481*Math.min(years, 43) + g*(p.reemployRate/100)*0.005481*reYears;
  return Math.round((83 + kousei)*0.9);
}
const isWho = (who, i) => who === 'both' || (who === 'A' && i === 0) || (who === 'B' && i === 1);
function pmt(P, ratePct, n){
  if(P <= 0 || n <= 0) return 0;
  const i = ratePct/100/12;
  return i === 0 ? P/n : P*i/(1 - Math.pow(1+i, -n));
}
function sumLiving(l){ return LIVING_ITEMS.reduce((a,[k]) => a + (+l[k]||0), 0); }
function eventYears(e, endY){
  const out = [];
  const rep = Math.max(0, Math.round(+e.repeat||0));
  if(!rep){ out.push(+e.year); return out; }
  const until = Math.min(+e.until || endY, endY);
  for(let y = +e.year; y <= until; y += rep) out.push(y);
  return out;
}
function childCost(k, a, y, st){

  else if(a <= 21 && k.univ !== 'none') life = k.away ? 0 : 40;

      if(a === 18){ edu += u.entry + (k.away ? AWAY.start : 0); note = '大学入学'; }
    } else if(a === 18) note = '就職';
  }
  return {edu, life, birth, note};
}

function simulate(st, extra = 0){
  const P = persons(st), A = P[0];
  const years = Math.max(1, Math.round(st.endAge - A.age));
  const endY = NOW + years;
  const infl = (+st.inflation||0)/100, pIdx = Math.max(0, infl - 0.005), r = (+st.savings.rate||0)/100;

  const kids = st.children.slice().sort((a,b) => a.birthYear - b.birthYear);
  const evMap = {};
  st.events.forEach(e => eventYears(e, endY).forEach(y => (evMap[y] = evMap[y] || []).push(e)));

  const moves = (H.moves||[]).slice().sort((a,b) => a.year - b.year);
  const loan = {bal:0, rate:0, months:0, pmt:0};
  const rows = [];
  for(let t = 0; t <= years; t++){
    const y = NOW + t, f = Math.pow(1 + infl, t);
    const ages = P.map(p => p.age + t);
    const inc = [], out = [], notes = [];
    let taxA = 0;
    P.forEach((p, i) => {
      const age = ages[i];
      if(t > 0) gross[i] *= 1 + growthOf(p, age - 1)/100;
      const until = Math.max(p.retireAge, p.reemployUntil);
      let g = 0;
      if(age < p.retireAge) g = gross[i];
      else if(age < until){ if(retireG[i] === null) retireG[i] = gross[i]; g = retireG[i]*(+p.reemployRate||0)/100; }
      let cut = 0, shortMul = 1;
      kids.forEach(k => {
        const kt = y - k.birthYear;
        if(kt < 0) return;
        const lm = isWho(k.leaveWho, i) ? (+k.leaveMonths||0) : 0;
        if(lm > 0){
          const ms = kt*12, me = Math.min(lm, ms + 12);
          if(me > ms){ const m1 = Math.max(0, Math.min(me, 6) - ms); const m2 = (me - ms) - m1; cut += (m1*0.2 + m2*0.4)/12; }
        }
        if(isWho(k.shortWho, i) && (+k.shortYears||0) > 0){
          const s0 = Math.ceil(lm/12);
          if(kt >= s0 && kt < s0 + (+k.shortYears)) shortMul = Math.min(shortMul, (+k.shortRate||0)/100);
        }
      });
      cut = Math.min(cut, 1);
      const gEff = g*shortMul;
      let net, tx;
      if(p.inputType === 'net'){ net = gEff; tx = taxes(gEff/0.78, age); } else { tx = taxes(gEff, age); net = tx.net; }
      net *= (1 - cut);
      if(i === 0) taxA = (tx.it + Math.min(tx.rt, 9.75))*(1 - cut);
      if(net > 0) inc.push({label:`${p.name}の手取り`, v:net, k:'work'});
      if(cut > 0) notes.push(`${p.name}育休`);
      if(age === p.retireAge){ if(+p.severance > 0) inc.push({label:`${p.name}の退職金`, v:+p.severance, k:'sev'}); notes.push(`${p.name}定年`); }
      if(age >= p.pensionStart) inc.push({label:`${p.name}の年金`, v:pBase[i]*Math.pow(1 + pIdx, t), k:'pension'});
      if(age === p.pensionStart) notes.push(`${p.name}年金開始`);
    });
    if(st.childAllowance !== false){
      let al = 0;
      kids.forEach((k, idx) => {
        const a = y - k.birthYear; if(a < 0 || a > 18) return;
        let rank = 0;
        for(let j = 0; j < idx; j++){ const aj = y - kids[j].birthYear; if(aj >= 0 && aj <= 22) rank++; }
        al += rank >= 2 ? 36 : (a <= 2 ? 18 : 12);
      });
      if(al > 0) inc.push({label:'児童手当', v:al, k:'allow'});
    }
    const ageA = ages[0];
    const retired = ageA >= st.retireLivingAge;
    const livM = retired ? (+st.retireLiving||0) : sumLiving(st.living);
    out.push({label: retired ? '生活費（老後）' : '生活費', v: Math.max(0, livM*12*f - extra*12), cat:'living'});
    const owned = H.buyOn && y >= B.year;
    if(!owned){
      let rent = +H.rent||0, moved = null;
      moves.forEach(m => { if(m.year <= y) rent = +m.rent||0; if(m.year === y) moved = m; });
      if(rent > 0) out.push({label:'家賃', v:rent*12*f, cat:'housing'});
      if(moved){ if(+moved.cost > 0) out.push({label:'住み替え（引っ越し・初期費用）', v:moved.cost*f, cat:'housing'}); notes.push('住み替え'); }
    }
    if(H.buyOn && y === B.year){
      out.push({label:'住宅購入（頭金・諸費用）', v:(+B.down||0) + (+B.price||0)*(+B.costRate||0)/100, cat:'housing'});
      loan.bal = Math.max(0, (+B.price||0) - (+B.down||0)); loan.rate = +B.rate||0; loan.months = Math.round((+B.years||0)*12);
      loan.pmt = pmt(loan.bal, loan.rate, loan.months);
      notes.push('住宅購入');
    }
    if(owned){
      const yi = y - B.year;
      if(B.rateUp && yi === +B.rateUpAfter && loan.months > 0){ loan.rate = +B.rateAfter||0; loan.pmt = pmt(loan.bal, loan.rate, loan.months); }
      let paid = 0; const mr = loan.rate/100/12;
      for(let m = 0; m < 12 && loan.months > 0; m++){ const it = loan.bal*mr; const pay = Math.min(loan.pmt, loan.bal + it); loan.bal = loan.bal + it - pay; paid += pay; loan.months--; }
      if(loan.months === 0) loan.bal = 0;
      if(paid > 0) out.push({label:'住宅ローン返済', v:paid, cat:'housing'});
      if(+B.mgmt > 0) out.push({label:'管理費・修繕積立金', v:B.mgmt*12*f, cat:'housing'});
      if(+B.tax > 0) out.push({label:'固定資産税', v:+B.tax, cat:'housing'});
      if(B.ded && yi < +B.dedYears && loan.bal > 0){
        const d = Math.min(loan.bal*0.007, (+B.dedCap||0)*0.007, taxA);
        if(d > 0) inc.push({label:'住宅ローン控除（税金の戻り）', v:d, k:'ded'});
      }
    }
    kids.forEach(k => {
      const a = y - k.birthYear; if(a < 0) return;
      const c = childCost(k, a, y, st);
      if(c.birth > 0) out.push({label:`${k.name}の出産・ベビー用品`, v:c.birth*f, cat:'child'});
      if(c.edu > 0) out.push({label:`${k.name}の保育・教育費`, v:c.edu*f, cat:'child'});
      if(c.life > 0) out.push({label:`${k.name}の生活費`, v:c.life*f*(+st.childLevel||1), cat:'child'});
      if(c.note) notes.push(`${k.name}${c.note}`);
    });
    const evs = evMap[y] || [];
    evs.forEach(e => {
      const v = (+e.amount||0)*(e.inflate ? f : 1);
      if(e.type === 'in') inc.push({label:e.name, v, k:'event'}); else out.push({label:e.name, v, cat:'event'});
    });
    const incT = inc.reduce((a,b) => a + b.v, 0), outT = out.reduce((a,b) => a + b.v, 0);
    const bal = incT - outT;
    const contrib = ageA < st.savings.until ? (+st.savings.monthly||0)*12 : 0;
    inv = inv*(1 + r) + contrib;
    cash = cash + bal - contrib;
    let sold = 0;
    if(cash < 0 && st.savings.autoSell && inv > 0){ sold = Math.min(inv, -cash); inv -= sold; cash += sold; }
    const cat = c => out.filter(o => o.cat === c).reduce((a,b) => a + b.v, 0);
    rows.push({y, t, ages, kidAges:kids.map(k => y - k.birthYear), inc, out, incT, outT, bal, contrib, sold, cash, inv, total:cash + inv,
      living:cat('living'), housing:cat('housing'), child:cat('child'), event:cat('event'), notes, evs:evs.map(e => e.name), once:evs.filter(e => !e.repeat).map(e => e.name)});
  }
  let minI = 0; rows.forEach((x, i) => { if(x.total < rows[minI].total) minI = i; });
  return {rows, P, kids, minI, firstNeg:rows.findIndex(x => x.total < 0), cashNeg:rows.findIndex(x => x.cash < 0), last:rows[rows.length-1], pBase};
}
// 最後まで資産がマイナスにならないために必要な「毎月の改善額」（万円）
function needExtra(st){
  const ok = x => simulate(st, x).rows.every(r => r.total >= 0);
  if(ok(0)) return 0;
  if(!ok(60)) return null;
  let lo = 0, hi = 60;
  for(let i = 0; i < 18; i++){ const m = (lo + hi)/2; if(ok(m)) hi = m; else lo = m; }
  return Math.ceil(hi*10)/10;
}

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function man(v, unit = '万'){
  if(v == null || isNaN(v)) return '—';
  const neg = v < 0; const a = Math.abs(v);
  let s;
  if(a >= 10000){ const oku = Math.floor(a/10000); const rest = Math.round(a - oku*10000); s = oku + '億' + (rest ? rest.toLocaleString('ja-JP') + unit : ''); }
  else s = (a < 10 && Math.round(a*10) % 10 ? a.toFixed(1) : Math.round(a).toLocaleString('ja-JP')) + unit;
  return (neg ? '−' : '') + s;
}
const fmtIn = v => { const n = +v; if(isNaN(n)) return ''; return Number.isInteger(n) ? String(n) : String(Math.round(n*100)/100); };
function toNum(s){
  if(typeof s === 'number') return s;
  s = String(s).replace(/[０-９．－]/g, c => c === '．' ? '.' : c === '－' ? '-' : String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[,，\s万円%％歳年月]/g, '');
  if(s === '' || s === '-' || s === '.') return NaN;
  return Number(s);
}
const getP = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
function setP(o, p, v){ const ks = p.split('.'); let a = o; for(let i = 0; i < ks.length - 1; i++) a = a[ks[i]]; a[ks[ks.length-1]] = v; }
const fid = k => 'f-' + k.replace(/\./g, '-');
function clampField(k, v){
  const last = k.split('.').pop();
  if(/^(age|retireAge|reemployUntil|pensionStart|until|retireLivingAge|endAge)$/.test(last)) return Math.min(110, Math.max(0, Math.round(v)));
  if(/year$/i.test(last)) return Math.min(NOW + 80, Math.max(NOW - 25, Math.round(v)));
  if(/Rate$|^rate$|inflation|young|mid|senior/.test(last)) return Math.max(0, Math.min(100, v));
  if(/years|Years|Months|After/.test(last)) return Math.max(0, Math.round(v));
  return Math.max(0, v);
}

function advice(){
  const out = [], rows = R.rows, A = S.people[0], now = rows[0];
  if(R.firstNeg >= 0){
    const n = rows[R.firstNeg];
    out.push({k:'bad', t:'要注意', m: NEED != null
      ? `${n.y}年（${esc(A.name)}${n.ages[0]}歳）から資産がマイナスになります。<b>毎月あと約${NEED}万円</b>の節約か収入アップで、${S.endAge}歳までマイナスにならない計算です。`
      : `${n.y}年から資産がマイナスになります。住まい・教育・大きなイベントの金額や時期を見直してみましょう。`});
  }
  const netInc = now.inc.filter(o => o.k === 'work').reduce((a, b) => a + b.v, 0);
  if(netInc > 0){
    const hr = now.housing/netInc*100;
    out.push({k: Math.round(hr) > 30 ? 'warn' : 'info', t:'住居費', m:`今年の住居費は手取りの<b>${Math.round(hr)}%</b>です。${Math.round(hr) > 30 ? '目安の25〜30%を超えています。' : '目安の25〜30%以内です。'}`});
    const sr = (now.bal)/now.incT*100;
    out.push({k: sr < 10 ? 'warn' : 'good', t:'貯蓄率', m:`今年は手取りの<b>${Math.max(0, Math.round(sr))}%</b>を貯められる計算です（積立投資の分を含む）。${sr < 10 ? 'まずは10〜20%を目指すと安心です。' : sr >= 20 ? 'よいペースです。' : 'この調子で続けましょう。'}`});
  }
  if(R.kids.length){
    let peak = rows[0]; rows.forEach(r => { if(r.child > peak.child) peak = r; });
    out.push({k:'info', t:'教育費', m:`子どもにかかるお金がいちばん多いのは<b>${peak.y}年</b>で、年${man(peak.child)}円です。この年までに準備しておけると安心です。`});
  }
  const tight = rows.filter(r => r.t > 0 && r.bal < 0).sort((a, b) => a.bal - b.bal)[0];
  if(tight && tight.bal < -100) out.push({k:'info', t:'大きな出費', m:`いちばん赤字が大きいのは<b>${tight.y}年</b>（${man(tight.bal)}円）。${esc([...tight.notes, ...tight.evs].slice(0, 3).join('、')) || '支出が重なる年'}が重なっています。`});
  if(!(+S.savings.monthly > 0)){
    const fv = 3*12*((Math.pow(1.03, 30) - 1)/0.03);
    out.push({k:'info', t:'ヒント', m:`積立投資がまだ0円です。例えば月3万円を年3%で30年続けると約${man(fv)}円になります（元本1,080万円）。NISAなら利益に税金がかかりません。`});
  }
  return out.slice(0, 6);
}

function niceTicks(mn, mx, n = 4){
  if(mx - mn < 1){ mx = mn + 1; }
  const raw = (mx - mn)/n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s*mag).find(s => s >= raw) || 10*mag;
  const lo = Math.floor(mn/step)*step, hi = Math.ceil(mx/step)*step, t = [];
  for(let v = lo; v <= hi + step/2; v += step) t.push(Math.round(v*100)/100);
  return t;
}
const axisMan = v => v === 0 ? '0' : Math.abs(v) >= 10000 ? (v/10000).toFixed(Math.abs(v) % 10000 ? 1 : 0) + '億' : Math.round(v).toLocaleString('ja-JP') + '万';
function xLabels(rows, X, H, B){
  const n = rows.length, step = n > 50 ? 10 : n > 24 ? 5 : n > 12 ? 2 : 1;
  let s = '';
  rows.forEach((r, i) => { if(r.y % step === 0 && i > 0 && i < n - 1 || (step === 1)){
    s += `<text x="${X(i)}" y="${H - B + 14}" text-anchor="middle">${r.y}</text><text x="${X(i)}" y="${H - B + 27}" text-anchor="middle">${r.ages[0]}歳</text>`; } });
  return s;
}
function assetSVG(rows, W){
  const H = 230, L = 50, Rm = 12, T = 16, B = 34, n = rows.length, bw = (W - L - Rm)/n;
  const vals = rows.map(r => r.total);
  const tk = niceTicks(Math.min(0, ...vals), Math.max(1, ...vals, ...rows.map(r => r.inv)), 4);
  const mn = tk[0], mx = tk[tk.length-1];
  const X = i => L + (i + 0.5)*bw, Y = v => T + (mx - v)/(mx - mn)*(H - T - B);
  const id = 'c' + Math.random().toString(36).slice(2, 7), y0 = Y(0);
  const line = rows.map((r, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(r.total).toFixed(1)}`).join('');
  const area = `M${X(0)},${y0}` + rows.map((r, i) => `L${X(i).toFixed(1)},${Y(r.total).toFixed(1)}`).join('') + `L${X(n-1)},${y0}Z`;
  const ia = `M${X(0)},${y0}` + rows.map((r, i) => `L${X(i).toFixed(1)},${Y(Math.max(0, Math.min(r.inv, Math.max(0, r.total)))).toFixed(1)}`).join('') + `L${X(n-1)},${y0}Z`;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="資産の推移グラフ"><defs><clipPath id="${id}p"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath><clipPath id="${id}n"><rect x="0" y="${y0}" width="${W}" height="${H}"/></clipPath></defs><g class="ax">`;
  tk.forEach(v => { s += `<line x1="${L}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${axisMan(v)}</text>`; });
  s += xLabels(rows, X, H, B) + '</g>';
  s += `<path class="a-pos" d="${area}" clip-path="url(#${id}p)"/><path class="a-neg" d="${area}" clip-path="url(#${id}n)"/><path class="a-inv" d="${ia}"/>`;
  s += `<line class="zero" x1="${L}" x2="${W - Rm}" y1="${y0}" y2="${y0}"/>`;
  s += `<path class="l-pos" d="${line}" clip-path="url(#${id}p)"/><path class="l-neg" d="${line}" clip-path="url(#${id}n)"/>`;
  rows.forEach((r, i) => { if(r.once.length || r.notes.some(x => /誕生|住宅購入|大学入学|住み替え/.test(x))) s += `<circle class="ev-dot" cx="${X(i)}" cy="${T - 8}" r="3"/>`; });
  const mi = rows.reduce((m, r, i) => r.total < rows[m].total ? i : m, 0);
  s += `<circle class="pt ${rows[mi].total < 0 ? 'neg' : 'acc'}" cx="${X(mi)}" cy="${Y(rows[mi].total)}" r="4"/>`;
  const lr = rows[n-1];
  s += `<circle class="pt ${lr.total < 0 ? 'neg' : 'acc'}" cx="${X(n-1)}" cy="${Y(lr.total)}" r="4"/><text class="lbl-end" x="${X(n-1) - 6}" y="${Y(lr.total) + (Y(lr.total) < T + 14 ? 16 : -9)}" text-anchor="end">${man(lr.total)}</text>`;
  const si = rows.findIndex(r => r.y === ui.sel);
  if(si >= 0) s += `<line class="cur" x1="${X(si)}" x2="${X(si)}" y1="${T - 2}" y2="${H - B}"/>`;
  s += `<rect class="hit" x="${L}" y="0" width="${W - L - Rm}" height="${H}"/></svg>`;
  return {svg:s, L, bw, W};
}
function flowSVG(rows, W){
  const H = 190, L = 50, Rm = 12, T = 10, B = 34, n = rows.length, bw = (W - L - Rm)/n;
  const vals = rows.map(r => r.bal);
  const tk = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), 4);
  const mn = tk[0], mx = tk[tk.length-1];
  const X = i => L + (i + 0.5)*bw, Y = v => T + (mx - v)/(mx - mn)*(H - T - B), y0 = Y(0);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="毎年の収支グラフ"><g class="ax">`;
  tk.forEach(v => { s += `<line x1="${L}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${axisMan(v)}</text>`; });
  s += xLabels(rows, X, H, B) + '</g>';
  const w = Math.max(1, bw*0.7);
  rows.forEach((r, i) => { const y = Y(r.bal); s += `<rect class="${r.bal < 0 ? 'b-neg' : 'b-pos'}" x="${(X(i) - w/2).toFixed(1)}" y="${Math.min(y, y0).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0.5, Math.abs(y - y0)).toFixed(1)}" rx="${Math.min(2, w/3).toFixed(1)}"/>`; });
  s += `<line class="zero" x1="${L}" x2="${W - Rm}" y1="${y0}" y2="${y0}"/>`;
  const si = rows.findIndex(r => r.y === ui.sel);
  if(si >= 0) s += `<line class="cur" x1="${X(si)}" x2="${X(si)}" y1="${T}" y2="${H - B}"/>`;
  s += `<rect class="hit" x="${L}" y="0" width="${W - L - Rm}" height="${H}"/></svg>`;
  return {svg:s, L, bw, W};
}
function drawCharts(){
  const a = $('#ch-assets'), f = $('#ch-flow');
  if(!a) return;
  const rows = rangeRows();
  [[a, assetSVG], [f, flowSVG]].forEach(([el, fn]) => {
    const W = Math.max(280, Math.round(el.clientWidth || 340));
    const g = fn(rows, W);
    el.innerHTML = g.svg;
    const pick = e => {
      const svg = el.querySelector('svg'), rc = svg.getBoundingClientRect();
      const x = (e.clientX - rc.left)*(g.W/rc.width);
      const i = Math.max(0, Math.min(rows.length - 1, Math.floor((x - g.L)/g.bw)));
      if(rows[i].y !== ui.sel){ ui.sel = rows[i].y; drawCharts(); $('#yp').innerHTML = yearPanel(); }
    };
    el.onpointerdown = e => { el._down = true; pick(e); };
    el.onpointermove = e => { if(el._down || e.pointerType === 'mouse') pick(e); };
    el.onpointerup = el.onpointercancel = el.onpointerleave = () => { el._down = false; };
  });
}

function wizFinish(){
  const s = baseState(), single = W.mode === 'single';
  s.mode = W.mode; s.area = W.area; s.osakaCity = !!(RENT_AREAS.find(a => a.id === W.area) || {}).city;
  const g = GROWTH[W.growth] || GROWTH.std;
  s.people = [defaultPerson(W.nameA || 'わたし', +W.ageA, +W.incA), defaultPerson(W.nameB || 'パートナー', +W.ageB, +W.incB)];
  s.people.forEach(p => { p.growth = W.growth; p.young = g.young; p.mid = g.mid; p.senior = g.senior; });
  s.savings.cash = +W.cash; s.savings.invest = +W.invest; s.savings.monthly = +W.monthly;
  s.housing.rent = +W.rent; s.housing.layout = W.layout;
  if(W.buy){ s.housing.buyOn = true; applyBuyType(s.housing.buy, W.buyType); s.housing.buy.year = +W.buyYear; }
  const lp = LIVING_PRESETS[W.living]; s.livingPreset = W.living;
  s.living = Object.fromEntries(Object.entries(lp.v).map(([k, v]) => [k, Math.round(v*(single ? 0.6 : 1)*10)/10]));
  if(single) s.retireLiving = 15;
  const A = s.people[0];
  if(!single && W.wed) s.events.push(...weddingEvents(+W.wedYear));
  for(let i = 0; i < +W.kids; i++) s.children.push(defaultChild(i, +W.kidYear + i*(+W.kidGap), single));
  if(W.tripDom) s.events.push(ev('国内旅行（1泊2日）', 10, NOW + 1, {repeat:1, until:NOW + (75 - A.age)}));
  if(W.tripAbroad) s.events.push(ev('海外旅行（アジア・4日間）', 40, NOW + 1, {repeat:3, until:NOW + (70 - A.age)}));
  if(W.car){ s.events.push(ev('車の購入', 300, +W.carYear, {repeat:10, until:NOW + (75 - A.age)})); s.events.push(ev('車の維持費（駐車場・保険・税金・車検・ガソリン）', 45, +W.carYear, {repeat:1, until:NOW + (80 - A.age)})); }
  S = s; save(); recalc();
  $('#wiz').hidden = true; document.body.style.overflow = '';
  ui.tab = 'result'; ui.sel = NOW; render(); window.scrollTo(0, 0);
  toast('ふたりの表ができました');

const TABS = [['result','結果','chart'],['input','入力','edit'],['events','予定','cal'],['table','年表','table'],['more','その他','more']];

/* ===== 操作 ===== */
const ACT = {
  growth: a => { const [i, k] = a.split(':'); const p = S.people[+i], g = GROWTH[k]; p.growth = k; p.young = g.young; p.mid = g.mid; p.senior = g.senior; afterChange(true); },
  livingPreset: a => { const single = S.mode === 'single'; S.livingPreset = a; S.living = Object.fromEntries(Object.entries(LIVING_PRESETS[a].v).map(([k, v]) => [k, Math.round(v*(single ? 0.6 : 1)*10)/10])); afterChange(true); },
  rentPreset: () => { const a = RENT_AREAS.find(x => x.id === S.area) || RENT_AREAS[1]; S.housing.rent = a.r[S.housing.layout]; afterChange(true); toast(`家賃を${S.housing.rent}万円にしました`); },
  addMove: () => { const a = RENT_AREAS.find(x => x.id === S.area) || RENT_AREAS[1]; S.housing.moves.push({year:NOW + 3, rent:a.r['3LDK'], cost:Math.round(a.r['3LDK']*4)}); afterChange(true); },
  delMove: a => { S.housing.moves.splice(+a, 1); afterChange(true); },
  buyType: a => { applyBuyType(S.housing.buy, a); afterChange(true); },
  addChild: () => { const last = S.children[S.children.length - 1]; S.children.push(defaultChild(S.children.length, last ? last.birthYear + 3 : NOW + 2, S.mode === 'single')); ui.open.kids = true; afterChange(true); },
  delChild: a => { S.children.splice(+a, 1); S.children.forEach((k, i) => { if(/^\d+人目$/.test(k.name)) k.name = `${i+1}人目`; }); afterChange(true); },
  range: a => { ui.range = a; render(); },
  tbl: a => { ui.tbl = a; render(); },
  row: a => yearSheet(+a),
  tpl: a => tplSheet(a),
  tplItem: a => { const [g, i] = a.split(':'); const it = TPL.find(x => x.id === g).items[+i]; const A = S.people[0];
    eventSheet(ev(it.name, it.amount, NOW + 1, {type:it.type, repeat:it.repeat || 0, until:it.repeat ? NOW + Math.max(1, 75 - A.age) : 0}), true); },
  wedSet: () => { const y = toNum($('#w-year').value); S.events.push(...weddingEvents(isNaN(y) ? NOW + 1 : y)); closeSheet(); afterChange(true); toast('結婚関連の予定を追加しました'); },
  newEvent: () => eventSheet(ev('', 10, NOW + 1), true),
  editEvent: a => { const e = S.events.find(x => x.id === a); if(e) eventSheet(e, false); },
  saveEvent: () => {
    const name = $('#e-name').value.trim() || '予定';
    const amt = toNum($('#e-amt').value), y = toNum($('#e-year').value), u = toNum($('#e-until').value);
    if(isNaN(amt) || isNaN(y)){ toast('金額と年を数字で入れてください'); return; }
    const e = {id:draft.id, name, amount:Math.max(0, amt), year:Math.round(y), type:draft.type, repeat:draft.repeat, until:draft.repeat ? Math.round(isNaN(u) ? y : Math.max(u, y)) : 0, inflate:$('#e-inf').checked};
    const i = S.events.findIndex(x => x.id === e.id);
    if(i >= 0) S.events[i] = e; else S.events.push(e);
    const isNew = draft._new; closeSheet(); afterChange(true); toast(isNew ? '予定を追加しました' : '保存しました');
  },
  delEvent: () => { S.events = S.events.filter(x => x.id !== draft.id); closeSheet(); afterChange(true); toast('削除しました'); },
  closeSheet: () => closeSheet(),
  openWiz: () => { wizInit(); renderWiz(); $('#wiz').hidden = false; $('#wiz').scrollTop = 0; document.body.style.overflow = 'hidden'; },
  closeWiz: () => { $('#wiz').hidden = true; document.body.style.overflow = ''; },
  wizBack: () => { if(wstep > 0){ wstep--; renderWiz(); $('#wiz').scrollTop = 0; } },
  wizNext: () => { if(wstep < WSTEPS.length - 1){ wstep++; renderWiz(); $('#wiz').scrollTop = 0; } else wizFinish(); },
  ackYear: () => { delete S.yearShifted; save(); render(); },
  copyBackup: () => {
    const txt = JSON.stringify(S);
    const done = () => toast('コピーしました。メモアプリなどに貼り付けて保存してください');
    const fallback = () => { const t = $('#restore-txt'); t.value = txt; t.focus(); t.select(); toast('下の枠のテキストを選択しました。コピーしてください'); };
    try{ navigator.clipboard.writeText(txt).then(done, fallback); }catch(e){ fallback(); }
  },
  saveFile: () => { const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `cashflow-backup-${NOW}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); },
  pickFile: () => $('#file-in').click(),
  restoreText: () => restoreFrom($('#restore-txt').value),
  reset: () => { if(!ui.resetArm){ ui.resetArm = true; render(); return; } ui.resetArm = false; S = baseState(); save(); recalc(); go('result'); ACT.openWiz(); },
  loadSample: () => { S = sampleState(); save(); recalc(); go('result'); },
};
function restoreFrom(text){
  try{
    const o = JSON.parse(String(text).trim());
    if(!o || !Array.isArray(o.people)) throw new Error();
    S = migrate(o); S.sample = false; save(); recalc(); go('result'); toast('データを復元しました');
  }catch(e){ toast('読み込めませんでした。コピーしたテキストをそのまま貼り付けてください'); }
}

/* ===== イベント処理 ===== */
document.addEventListener('click', e => {
  const rb = e.target.closest('[data-radio] [data-rv]');
  if(rb){ const g = rb.closest('[data-radio]'); $$('[data-rv]', g).forEach(b => b.setAttribute('aria-pressed', String(b === rb)));
    const key = g.dataset.radio; draft[key] = key === 'repeat' ? +rb.dataset.rv : rb.dataset.rv;
    if(key === 'repeat') $('#e-until-row').hidden = !draft.repeat; return; }
  const ss = e.target.closest('[data-sstep]');
  if(ss){ const inp = $('#' + ss.dataset.sstep); const v = toNum(inp.value); inp.value = (isNaN(v) ? NOW : v) + (+ss.dataset.d); sheetAges(); return; }
  const ws = e.target.closest('[data-wset]');
  if(ws){ let v = ws.dataset.v; if(ws.dataset.t === 'num' || /^(kids|kidGap)$/.test(ws.dataset.wset)) v = Number(v); if(v === 'true' || v === 'false') v = v === 'true'; W[ws.dataset.wset] = v; renderWiz(); return; }
  const wst = e.target.closest('[data-wstep]');
  if(wst){ const k = wst.dataset.wstep; W[k] = (+W[k] || 0) + (+wst.dataset.d); const inp = $('#w-' + k); if(inp) inp.value = W[k]; return; }
  const b = e.target.closest('[data-tab],[data-set],[data-step],[data-act]');
  if(!b) return;
  if(b.dataset.tab){ go(b.dataset.tab); return; }
  if(b.dataset.set){ let v = b.dataset.v; const t = b.dataset.t; if(t === 'num') v = Number(v); else if(t === 'bool') v = v === 'true'; setP(S, b.dataset.set, v); afterChange(true); return; }
  if(b.dataset.step){ const k = b.dataset.step; setP(S, k, clampField(k, (+getP(S, k) || 0) + (+b.dataset.d))); const inp = document.getElementById(fid(k)); if(inp) inp.value = fmtIn(getP(S, k)); afterChange(b.dataset.rr === '1'); return; }
  if(b.dataset.act && ACT[b.dataset.act]){ ACT[b.dataset.act](b.dataset.a, b); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.wk){ if(el.type !== 'checkbox' && el.tagName !== 'SELECT'){ W[el.dataset.wk] = el.dataset.t === 'str' ? el.value : (isNaN(toNum(el.value)) ? W[el.dataset.wk] : toNum(el.value)); } return; }
  if(el.id === 'e-year' || el.id === 'e-until'){ sheetAges(); return; }
  const k = el.dataset.k; if(!k || el.type === 'checkbox' || el.tagName === 'SELECT') return;
  if(el.dataset.t === 'str'){ setP(S, k, el.value); save(); updateLive(); return; }
  const v = toNum(el.value); if(isNaN(v)) return;
  setP(S, k, v);
  if(S.sample){ S.sample = false; }
  save(); recalc(); updateLive();
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'file-in'){ const f = el.files && el.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = () => restoreFrom(rd.result); rd.readAsText(f); el.value = ''; return; }
  if(el.dataset.wk){ const k = el.dataset.wk;
    if(el.type === 'checkbox'){ W[k] = el.checked; renderWiz(); }
    else if(el.tagName === 'SELECT'){ W[k] = el.value; if(k === 'area') renderWiz(); }
    else if(el.dataset.t !== 'str'){ const v = toNum(el.value); W[k] = isNaN(v) ? 0 : Math.max(0, v); el.value = fmtIn(W[k]); }
    return; }
  const k = el.dataset.k; if(!k) return;
  if(k.endsWith('pensionAuto_x')){ setP(S, k.replace('_x', ''), !el.checked); afterChange(true); return; }
  if(el.type === 'checkbox'){ setP(S, k, el.checked); afterChange(true); return; }
  if(el.tagName === 'SELECT'){ setP(S, k, el.dataset.t === 'num' ? Number(el.value) : el.value); afterChange(true); return; }
  if(el.dataset.t === 'str'){ setP(S, k, el.value.trim() || (getP(S, k) || '')); afterChange(true); return; }
  let v = toNum(el.value); if(isNaN(v)) v = 0; v = clampField(k, v); setP(S, k, v); el.value = fmtIn(v);
  afterChange(el.dataset.rr === '1');
});
document.addEventListener('toggle', e => { const d = e.target; if(d.dataset && d.dataset.sec){ ui.open[d.dataset.sec] = d.open; saveUi(); } }, true);
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if(!$('#sheet').hidden) closeSheet(); else if(!$('#wiz').hidden) ACT.closeWiz(); } });
window.addEventListener('scroll', () => $('.top').classList.toggle('scrolled', window.scrollY > 4), {passive:true});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if(ui.tab === 'result') drawCharts(); }, 150); });
$('#tabbar').innerHTML = `<div class="tabbar-in">${TABS.map(([id, l, ic]) => `<button type="button" class="tab" data-tab="${id}" aria-selected="false">${svgIcon(ic)}<span>${l}</span></button>`).join('')}</div>`;
$('#hpill').addEventListener('click', () => go('result'));
render();

})();
</script>
</body>
</html>
